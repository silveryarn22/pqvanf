<h1>Leaf Tack Support</h1>
<p>Brush size on a bare panel. Wait once and the size tacks. Lay the leaf then. A leaf laid while the size is wet slides off. A leaf laid after the size is dry misses. A leaf that stayed is not lifted.</p>
